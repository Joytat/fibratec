<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba HLS nativo LG</title>
<style>
  html,body{margin:0;min-height:100%;background:#070912;color:#fff;font:18px Arial,sans-serif}
  main{padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px}
  h1{font-size:24px;margin:0;color:#c4b5fd}
  video{display:block;width:min(90vw,1280px);height:70vh;object-fit:contain;background:#000}
  #status{padding:12px 18px;border:1px solid #4f46e5;border-radius:8px}
</style>
</head>
<body>
<main>
  <h1>Prueba HLS nativo LG</h1>
  <div id="status">Cargando video H.264/AAC de prueba…</div>
  <video id="testVideo" controls autoplay muted playsinline src="/iptv213-hls-test/stream.m3u8"></video>
</main>
<script>
const v=document.getElementById('testVideo');
const s=document.getElementById('status');
v.addEventListener('loadedmetadata',()=>s.textContent='Video detectado: '+v.videoWidth+' × '+v.videoHeight);
v.addEventListener('playing',()=>s.textContent='REPRODUCIENDO: debería verse la imagen de prueba.');
v.addEventListener('error',()=>s.textContent='Error de video HTML5: '+(v.error?v.error.code:'desconocido'));
</script>
</body>
</html>
